<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Procept R1 materials</title>
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root { --bg: #0D0F0D; --fg: #fff; --mute: #636363; --accent: #7B896F; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: 'Instrument Sans', 'Inter', system-ui, sans-serif; }
    main { width: 100%; max-width: 560px; padding: 0 24px; }
    .eyebrow { font: 11px/1 ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 24px 0 0; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; text-transform: uppercase; }
    p { margin: 18px 0 0; color: var(--mute); line-height: 1.6; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Procept R1</p>
    <h1>Welcome</h1>
    <p>Our deck and demo will be available here soon.</p>
  </main>
</body>
</html>
